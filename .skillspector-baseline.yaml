- skill: directory-submissions
  id: RA2
  path: references/directory-list.md
  message: '*plist*'
  reason: 字串 plist 只是公開目錄品牌 OnToplist 的子字串；文件不建立 launchd plist、cron 或跨 session 持久化。
- skill: events
  id: E4
  path: SKILL.md
  message: '*Capture context*'
  reason: Capture context 是請業務人員記錄活動對話重點以便跟進的行銷建議，不是外傳 agent 對話上下文。
- skill: marketing-loops
  id: EA4
  path: evals/evals.json
  message: '*loop forever*'
  reason: 評測明確要求流程具有停止條件且不得無限循環，不是允許無界資源或 API 消耗。
- skill: revops
  id: RA2
  path: references/automation-playbooks.md
  message: '*Create task for*'
  reason: Create task for CS 是 CRM 內建的客戶成功待辦流程，不是建立 cron、開機腳本或跨 session 持久化。
