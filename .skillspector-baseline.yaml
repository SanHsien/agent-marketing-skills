  reason_code: obfuscated_instruction_text
  sha256: b7f03614af776e90259f28cc1f484ce22a86c71ef35a1e5a4b9e24b6d89aecd4
  reason: 2026-10-24 人工審閱：觸發點是 EU 段落的退訂話術範例（第 53 行，請對方回覆 'remove' 就刪除資料）。掃描器把「remove + 引號內容」解讀成「刪掉這些字元」的指令並嘗試重建，判為無法確定後保守標成混淆。全文是 GDPR／PECR／CASL／DNC 合規說明，沒有零寬或格式字元、沒有編碼字串。
rules: []
scoped_rules:
- skill: ad-creative
  id: RP1
  path: references/generative-tools.md
  reason: 自我指涉誤判：第三方生成工具的 npx 安裝範例是提供給使用者參考的文件文字，不是此 skill 綁定執行的 MCP 或 CLI 設定。
