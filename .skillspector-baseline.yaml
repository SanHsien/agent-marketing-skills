# SkillSpector baseline for this repository's own skills/ (release gate ratchet).
# Every entry below is an ALREADY-REVIEWED finding accepted at baseline creation time.
# New findings are NOT suppressed automatically -- they fail tools/dev_check.ps1 until
# someone reviews them and adds a fingerprint + reason here (or fixes the skill).
# Regenerate a skill's entries with: skillspector baseline skills/<name> --no-llm --reason '...'
version: 2
scanner_version: 2.11.2
# reviewed_partials: files a bounded static parser could not finish, reviewed by hand.
# tools/run_skillspector.py strips this key before the scanner reads the baseline and
# accepts the matching degraded analyzer only while the file's SHA-256 (as staged, LF)
# still equals `sha256` -- any edit to the file reopens the review.
reviewed_partials:
- skill: ad-creative
  path: assets/creative-review-template.html
  analyzer: static_patterns_tool_misuse
  reason_code: static_parse_limit
  sha256: 0ca7cce4fa809235aee776606205925d8dc01bde8a8325e2af7197d86394d3b7
  reason: 2026-10-24 人工審閱上游 7433769 版本：單一自足的審稿頁，只解析頁內 <script id="review-data"> 的 JSON 並渲染；沒有 fetch／XMLHttpRequest、外部 script、shell 或檔案存取，所有 innerHTML 插值都經 esc() 跳脫 &<>"'。解析器跨度上限是被頁內的大段 JSON 與樣板字串觸發，不是工具濫用。
